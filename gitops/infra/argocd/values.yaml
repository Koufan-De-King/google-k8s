# Helm values for the argo-cd chart. This file is the whole configuration
# surface for Argo CD in this cluster — both at bootstrap time (rendered by
# `helm template`) and forever after (read by Argo CD's own Application, via
# the $values ref in application.yaml). One file, one source of truth, no
# drift between "how it was installed" and "how it's managed".
#
# Chart defaults are good. Everything set below is set for a reason, stated.

# The hostname Argo CD is reachable at, and believes itself to be reachable
# at. Set this, never `configs.cm.url` — the chart derives the url from this
# value, and setting both invites them to disagree.
#
# It drives three things: the Ingress hostname, the names on the TLS
# certificate cert-manager requests, and the address Argo CD hands to an
# identity provider as the "redirect back to here" target. That third one is
# why Keycloak will care about this line.
global:
  domain: argocd.koufan.dev

configs:
  params:
    # Run argocd-server WITHOUT TLS on its own listener. The flag is badly
    # named: it describes the listener, not the site. The site is HTTPS.
    #
    # TLS terminates one hop earlier, at ingress-nginx, using a real Let's
    # Encrypt certificate. Two hops, two different answers:
    #
    #   browser  -> nginx           HTTPS, trusted cert, public internet
    #   nginx    -> argocd-server   plain HTTP, inside the pod network
    #
    # koufan.dev is on the HSTS preload list, so browsers refuse plain HTTP
    # to it outright. That constraint is satisfied by the first hop and says
    # nothing about the second.
    #
    # This stays `true`. Setting it to false would make argocd-server present
    # a SELF-SIGNED certificate to nginx, which nginx would then have to be
    # told not to verify (`proxy-ssl-verify off`) — encryption without
    # authentication, on a hop that never leaves the cluster. It also breaks
    # the gRPC path the `argocd` CLI uses. This is the arrangement Argo CD's
    # own docs recommend behind an nginx ingress; it is the intended design,
    # not a compromise.
    #
    # The honest residual: that internal hop is unencrypted, so node-level
    # access could read it. The real answer at scale is a service mesh doing
    # mTLS uniformly, not hand-rolled self-signed certs between pods.
    server.insecure: true

  cm:
    # Disable the web terminal. It lets anyone with UI access exec into pods,
    # which is a substantial privilege escalation from "can view apps" and is
    # off by default in the chart. Stated explicitly rather than relied upon,
    # because it becomes much more interesting once Keycloak is issuing
    # logins to more than one person.
    exec.enabled: "false"

    # `configs.cm.url` is deliberately absent. The chart derives it from
    # `global.domain` at the top of this file, which is now the real
    # hostname, so the rendered argocd-cm already carries
    # https://argocd.koufan.dev. Setting it here as well would create two
    # sources of truth that can drift apart.

    # ---------------------------------------------------------------------
    # Keycloak / OIDC — the next thing to land. Left here as a marker so the
    # shape of the change is visible before it's made.
    #
    # The clientSecret is written as `$oidc.keycloak.clientSecret`, which is
    # not a literal: the leading `$` tells Argo CD to read the value out of
    # the argocd-secret Secret at that key. That indirection is the point —
    # the secret itself never appears in this file, and therefore never in
    # this public repo. Getting the secret *into* the cluster is a separate
    # problem (sealed-secrets, external-secrets, or by hand once) and is a
    # decision for that piece of work, not this one.
    # ---------------------------------------------------------------------
    # oidc.config: |
    #   name: Keycloak
    #   issuer: https://keycloak.example.com/realms/homelab
    #   clientID: argocd
    #   clientSecret: $oidc.keycloak.clientSecret
    #   requestedScopes: ["openid", "profile", "email", "groups"]

  rbac:
    # Everyone who authenticates but matches no other rule gets read-only.
    #
    # Irrelevant while the only account is the built-in admin (which bypasses
    # RBAC entirely), and load-bearing the instant Keycloak starts issuing
    # logins: the default would otherwise decide what a brand-new, unmapped
    # identity can do. Deny-by-default now means adding Keycloak can't
    # accidentally hand out more access than intended.
    policy.default: role:readonly

    # Group-to-role mapping goes here once Keycloak issues group claims:
    # policy.csv: |
    #   g, argocd-admins, role:admin

# The bundled Dex is only needed to bridge identity providers that don't
# speak OIDC (GitHub, SAML, LDAP). Keycloak *is* an OIDC provider, so Argo CD
# can talk to it directly and this pod would sit idle forever. Off.
dex:
  enabled: false

# Single-replica everything. This is a 3-node e2-medium cluster where the
# realistic failure mode is "the whole zone went away" — which HA replicas
# inside that zone would not survive either. Paying for redundancy that
# doesn't cover the actual risk is just spending RAM.
controller:
  replicas: 1
server:
  replicas: 1
  ingress:
    enabled: true
    controller: generic          # generic = a standard Ingress object
    ingressClassName: nginx
    tls: true                    # emits the spec.tls block
    annotations:
      # THIS is what triggers everything. cert-manager watches Ingress
      # objects for this annotation and creates a Certificate from the
      # spec.tls block automatically.
      cert-manager.io/cluster-issuer: letsencrypt-prod
repoServer:
  replicas: 1
applicationSet:
  replicas: 1

# The Redis instance Argo CD uses is a *cache*, not a datastore — the real
# state is the cluster and this git repo. Losing it costs a slow first
# refresh, nothing more. Left as the chart's simple single instance.
redis:
  enabled: true

# Notifications (Slack/webhook alerts on sync failures) are genuinely useful
# but need somewhere to send to. Off until there is one.
notifications:
  enabled: false
