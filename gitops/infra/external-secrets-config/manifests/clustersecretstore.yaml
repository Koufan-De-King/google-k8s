apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: project-b3b52501-db4a-4fd7-9e7
      # No auth block. This is intentional and is the whole point:
      # omitting it falls back to Application Default Credentials, which
      # inside a Workload-Identity-enabled pod resolves via the GKE
      # metadata server to this controller own KSA. Adding a secretRef
      # here would mean storing a GSA key - the thing being avoided.
