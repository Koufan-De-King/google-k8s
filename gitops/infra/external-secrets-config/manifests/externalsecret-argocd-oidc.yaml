apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd          # must be where the consumer lives
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: argocd-oidc-secret
    creationPolicy: Owner
  data:
    - secretKey: clientSecret            # key inside the k8s Secret
      remoteRef:
        key: argocd-oidc-client-secret   # secret NAME in GCP
        version: latest
