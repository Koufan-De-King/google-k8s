apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd          # must be where the consumer lives
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: argocd-oidc-secret
    creationPolicy: Owner
  data:
    # `secretKey` and `remoteRef.key` are two different namespaces and are
    # easy to conflate. secretKey is the key INSIDE the generated Kubernetes
    # Secret; remoteRef.key is the name of the secret in GCP Secret Manager.
    # They have no reason to match and here they deliberately do not.
    - secretKey: clientSecret             # key inside the k8s Secret
      remoteRef:
        # Must match `gcloud secrets list` EXACTLY, including case.
        #
        # Getting this wrong does not produce a "not found" error. Secret
        # Manager answers a request for a non-existent secret with
        # PermissionDenied on secretmanager.versions.access, identical to a
        # genuine IAM failure — deliberately, so the API cannot be used to
        # probe which secret names exist. The message hedges with "(or it
        # may not exist)" and that clause is the entire clue.
        #
        # So: on PermissionDenied, check the NAME before touching IAM.
        key: ARGOCD_CLIENT_SECRET
        version: latest
