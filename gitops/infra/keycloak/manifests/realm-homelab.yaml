# -----------------------------------------------------------------------------
# The homelab realm
# -----------------------------------------------------------------------------
# A realm is Keycloak's tenancy boundary: its own users, clients, roles and
# signing keys, isolated from every other realm. The `master` realm that exists
# by default is where Keycloak's own administrators live, and putting
# applications in it means an application misconfiguration is a compromise of
# the thing that administers Keycloak. So applications get their own realm.
#
# spec.realm below is a Keycloak RealmRepresentation — the same structure the
# admin console exports. That is what makes this declarative: the realm is
# described here rather than clicked into existence, and it can be recreated
# on a rebuilt cluster.
#
# WHAT THIS DOES AND DOES NOT COVER:
#
# Configuration lives here. Users do not. Creating people as YAML would mean
# their credentials in git, and a user's password is theirs rather than the
# repo's. So: realm, groups, scopes and mappers are declared; you create your
# own account in the admin console and add it to argocd-admins.
#
# That split is the honest one — identity *configuration* is reproducible from
# this repo, identity *data* is not. It is the same line drawn in postgres.yaml.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: homelab
  namespace: keycloak
spec:
  keycloakCRName: keycloak

  # The import runs as a Job that boots a full Keycloak in import mode, and the
  # operator defaults that Job to requesting 1700Mi. On this cluster the most
  # any node had free was about 1654Mi, so it missed by roughly 50Mi and sat
  # Pending with "0/3 nodes are available: 3 Insufficient memory".
  #
  # Same fix as Keycloak's CPU request: lower the reservation, keep the
  # ceiling. The JVM still gets up to 1700Mi if it wants it; the scheduler only
  # has to find 1Gi. Importing a realm this small does not come close to
  # either number — the default is sized for importing a large existing realm.
  #
  # Second time cluster size has blocked a deployment. See Phase 4.5 in
  # docs/ROADMAP.md; this is a symptom, not the fix.
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 1700Mi

  # Injects the Argo CD client secret into the realm JSON below at import time.
  # The realm references it as $(env:ARGOCD_CLIENT_SECRET); this maps that name
  # to a key in a Kubernetes Secret that ESO populates from GCP Secret Manager.
  #
  # This is what allows the client to be declared here without its secret being
  # written into this repo.
  placeholders:
    ARGOCD_CLIENT_SECRET:
      secret:
        name: argocd-oidc-client
        key: clientSecret

  realm:
    realm: homelab
    enabled: true
    displayName: Homelab

    # Groups are how authorisation is expressed. Argo CD's RBAC maps a group
    # name to a role, so membership of argocd-admins is what grants admin —
    # not a per-user rule that has to be edited every time someone joins.
    groups:
      - name: argocd-admins
      - name: argocd-viewers

    # -------------------------------------------------------------------
    # The Argo CD OIDC client
    # -------------------------------------------------------------------
    # Declared here rather than as a KeycloakOIDCClient CR. That CR exists and
    # would be tidier, but it requires the server feature client-admin-api:v2,
    # which Keycloak itself labels Experimental — and it failed twice on this
    # cluster: first refusing the resource outright, then throwing a
    # NullPointerException inside the operator's own admin client. Recovering
    # from the second would have meant switching bootstrapAdmin to its service
    # form, which the CRD documents as applying "only for initial cluster
    # creation" — a database wipe.
    #
    # Nothing is lost by declaring it here. The client is still described in
    # git, still reproducible on a rebuilt cluster, still reviewed in a diff.
    # Only the CRD wrapper is gone.
    #
    # The one real cost: Keycloak's import will not necessarily overwrite an
    # existing realm, so editing this client later may not take effect until
    # the realm is re-imported or the change is made in the console. Revisit
    # the CR approach once client-admin-api leaves preview.
    clients:
      - clientId: argocd
        name: Argo CD
        description: GitOps controller at argocd.koufan.dev
        enabled: true

        # A confidential client: it authenticates itself with a secret as well
        # as passing the user's token. `publicClient: false` is what makes the
        # `secret` field below meaningful.
        publicClient: false
        # ${VAR}, not $(env:VAR). The latter is silently left as a literal —
        # and worse, Keycloak then treats it as an unusable value and
        # generates a random secret instead, so the client works, Argo CD
        # holds a different secret, and every login fails with
        # "invalid_client" while both sides look correctly configured.
        secret: "${ARGOCD_CLIENT_SECRET}"

        # Standard authorization-code flow. Everything else off: this is a
        # server-side web application, not a device, a service account, or a
        # legacy password-grant client.
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        implicitFlowEnabled: false

        # Where Keycloak may send the browser after authentication. A security
        # control rather than routing: it is what stops an attacker completing
        # a login and having the token delivered to a host they control.
        #
        # /auth/callback is Argo CD's own handler. The /api/dex/callback path
        # in most guides is Dex's, and Dex is disabled here because Keycloak
        # speaks OIDC directly.
        redirectUris:
          - https://argocd.koufan.dev/auth/callback
        webOrigins:
          - https://argocd.koufan.dev
        baseUrl: https://argocd.koufan.dev

        # No defaultClientScopes listed, deliberately. During a realm import
        # the built-in scopes (profile, email, roles, web-origins) do not
        # exist yet when the client is processed, so naming them here makes
        # Keycloak log "Referenced client scope 'profile' doesn't exist" and
        # silently drop them — leaving the client with fewer scopes than
        # asked for. Omitting the list lets Keycloak attach the realm defaults
        # once they exist.
        #
        # Group membership is therefore attached as a mapper on the client
        # itself rather than through a custom scope. Same claim, no ordering
        # problem.
        #
        # This mapper is load-bearing: Keycloak does not put group membership
        # in tokens by default. Without it, login succeeds, the `groups` claim
        # is absent, every user falls through to policy.default, and it looks
        # like Argo CD's RBAC is broken when the token never carried the
        # information.
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              # "false" emits "argocd-admins" rather than "/argocd-admins".
              # Argo CD matches the literal string in policy.csv, and a
              # leading slash fails to match silently.
              full.path: "false"
              claim.name: groups
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"

    # Sensible for a homelab, and stated rather than inherited: no open
    # self-registration, and no password reset flow that depends on email
    # delivery this cluster has not configured.
    registrationAllowed: false
    resetPasswordAllowed: false
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
