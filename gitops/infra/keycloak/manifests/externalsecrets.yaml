# -----------------------------------------------------------------------------
# Keycloak's two secrets, pulled from GCP Secret Manager
# -----------------------------------------------------------------------------
# The first real reuse of the machinery built for Argo CD's OIDC secret. Note
# what is NOT here: no ClusterSecretStore, no IAM wiring, no auth config. That
# was one-time work, and every secret from here on costs one manifest.
#
# Both use `template` to combine a value fetched from Secret Manager with a
# literal username. Only the passwords are secret; the usernames are not, and
# storing them in Secret Manager would mean paying for a version and managing
# rotation for a string that is written in this file anyway.
#
# NAMING: these use a `k8s-` prefix, unlike the existing ARGOCD_CLIENT_SECRET.
# That is deliberate. A single IAM binding with a condition on
# resource.name.startsWith(".../secrets/k8s-") grants ESO access to every
# future secret matching the convention, instead of one binding per secret
# forever. See docs/secrets.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: keycloak-db
    creationPolicy: Owner
    # Declared explicitly even though these are the CRD's own defaults. Leave
    # them out and the API server fills them in, the live object then differs
    # from this file, and Argo CD reports the app permanently OutOfSync — real
    # drift would be invisible among the noise. Writing the defaults down costs
    # three lines and keeps the dashboard meaningful.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      # Produces a Secret with two keys. `username` is a literal; `password`
      # interpolates the value fetched below. Both Postgres and Keycloak read
      # this same Secret, which is what keeps them in agreement — there is one
      # source for the credential, not two copies that can drift.
      data:
        username: keycloak
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        # Must match `gcloud secrets list` exactly, including case. A wrong
        # name returns PermissionDenied, not NotFound — see the comment in
        # gitops/infra/external-secrets-config/manifests/.
        key: k8s-keycloak-db-password
        version: latest
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    # Referenced by spec.bootstrapAdmin.user.secret on the Keycloak CR. The
    # operator requires exactly the keys `username` and `password`.
    name: keycloak-admin
    creationPolicy: Owner
    # Declared explicitly even though these are the CRD's own defaults. Leave
    # them out and the API server fills them in, the live object then differs
    # from this file, and Argo CD reports the app permanently OutOfSync — real
    # drift would be invisible among the noise. Writing the defaults down costs
    # three lines and keeps the dashboard meaningful.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        username: admin
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: k8s-keycloak-admin-password
        version: latest
