# -----------------------------------------------------------------------------
# The Keycloak instance
# -----------------------------------------------------------------------------
# A custom resource, not a Deployment. The operator watches this object and
# creates the StatefulSet, Service, Ingress and everything else from it. What
# is written here is intent; the operator owns the mechanics.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1

  db:
    vendor: postgres
    # The headless Service in postgres.yaml. Same namespace, so the short name
    # resolves.
    host: keycloak-postgres
    port: 5432
    database: keycloak
    # Both point at the Secret ESO generates. Keycloak and Postgres read the
    # same credential from the same place rather than holding two copies.
    usernameSecret:
      name: keycloak-db
      key: username
    passwordSecret:
      name: keycloak-db
      key: password

  # The full external URL, not a bare hostname. Keycloak 26 uses "hostname v2",
  # where this value is what Keycloak believes it is reachable at, and it ends
  # up in issuer URLs, discovery documents and OIDC redirects.
  #
  # This is the same class of setting as global.domain on Argo CD, and it fails
  # the same way when wrong: tokens are issued with an issuer nobody can reach,
  # and the error surfaces at the client rather than here.
  # Required by the KeycloakOIDCClient CR. Without it the operator refuses the
  # client with:
  #
  #   Cannot create/update because the server does not have
  #   client-admin-api:v2 enabled
  #
  # The CRD exists in the operator regardless, so this reads as a bug in the
  # manifest rather than a missing server capability — the resource is
  # accepted by the API server and only fails later, in the operator's
  # reconcile loop.
  #
  # `client-admin-api:v2` is the newer admin API that lets the operator manage
  # clients as CRs. It is versioned (`feature:version`) because Keycloak ships
  # multiple generations of a feature simultaneously, and it is not on by
  # default in 26.7 — declaring clients declaratively is still newer ground
  # than declaring realms. That is the trade for keeping the OIDC client in
  # git rather than in the admin console.
  features:
    enabled:
      - client-admin-api:v2

  hostname:
    hostname: https://keycloak.koufan.dev

  # Serve plain HTTP from the pod. Identical reasoning to Argo CD's
  # server.insecure — TLS terminates at ingress-nginx one hop earlier, on a
  # real Let's Encrypt certificate. Running TLS here too would mean a
  # self-signed certificate that nginx must be told not to verify.
  http:
    httpEnabled: true

  # Because TLS terminates upstream, Keycloak sees plain HTTP on the wire and
  # would otherwise conclude it is being accessed over HTTP — generating
  # http:// redirect URLs that break the OIDC flow. This tells it to trust
  # X-Forwarded-* headers from the ingress and reconstruct the real scheme.
  #
  # `xforwarded` is correct for ingress-nginx. It is a security-relevant
  # setting: it means Keycloak trusts those headers, which is only safe
  # because nothing can reach the pod except through the ingress.
  proxy:
    headers: xforwarded

  # The operator creates and manages the Ingress itself, so there is no
  # separate Ingress manifest here. cert-manager sees the annotation, issues a
  # certificate for the host, and writes it into keycloak-tls — exactly the
  # flow already proven for argocd.koufan.dev.
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tlsSecret: keycloak-tls

  # Created by the keycloak-admin ExternalSecret. The operator requires the
  # Secret to carry `username` and `password` keys.
  #
  # "bootstrap" is meant literally: this account exists to create the first
  # real admin and should be removed afterwards. Keycloak logs a warning while
  # it remains in use.
  bootstrapAdmin:
    user:
      secret: keycloak-admin

  resources:
    # 250m did not schedule. `0/3 nodes are available: 3 Insufficient cpu`,
    # with 215m / 171m / 5m actually free per node.
    #
    # The arithmetic is worth writing down, because it is a property of the
    # cluster rather than of Keycloak. Three e2-medium nodes give ~2820m
    # allocatable in total, and GKE's own components claim about 1560m of it
    # before any workload of ours exists: kube-dns 540m, fluentbit 315m,
    # kube-proxy 300m, gke-metadata-server 300m, kube-state-metrics 105m.
    # That last one is new — enabling Workload Identity added a
    # gke-metadata-server pod per node, so that step cost 300m of cluster CPU
    # which nothing warned about at the time.
    #
    # A request is a scheduling reservation, not a ceiling. 150m is what
    # Keycloak is guaranteed and what the scheduler subtracts from a node;
    # the 1 CPU limit is what it may actually burst to, and since the nodes
    # are far below 100% real utilisation, JVM startup still gets the CPU it
    # wants. Lowering this trades guaranteed capacity for schedulability,
    # which is the right trade on a cluster this size.
    #
    # It is a workaround, not a fix. The cluster is now ~99% requested, so
    # the next component will not schedule at all. See docs/ROADMAP.md.
    requests:
      cpu: 150m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
